name: Preview
run-name: preview-${{ inputs.attempt }}
on:
  workflow_dispatch:
    inputs:
      attempt:
        description: Identificador da tentativa reservado pelo Opex
        required: true
      sha:
        description: SHA completo da implementação
        required: true
      preview_url:
        description: Endereço público com a porta reservada pelo Opex
        required: true
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validar inputs
        env:
          ATTEMPT: ${{ inputs.attempt }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$ATTEMPT" =~ ^[A-Za-z0-9_-]+$ ]] && [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testes completos (antes do build)
        run: pnpm test
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build e artefato
        env:
          ATTEMPT: ${{ inputs.attempt }}
          SHA: ${{ inputs.sha }}
          PLATFORM: ${{ vars.PREVIEW_PLATFORM || 'linux/amd64' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.PREVIEW_APP_URL || inputs.preview_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PREVIEW_BASE_PATH }}
          NEXT_PUBLIC_PUSHER_KEY: ${{ vars.NEXT_PUBLIC_PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER: ${{ vars.NEXT_PUBLIC_PUSHER_CLUSTER }}
          NEXT_PUBLIC_PUSHER_URL: ${{ vars.NEXT_PUBLIC_PUSHER_URL }}
        run: |
          docker buildx build --load --platform "$PLATFORM" --tag "opex-preview:$ATTEMPT" \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            --build-arg NEXT_PUBLIC_BASE_PATH="$NEXT_PUBLIC_BASE_PATH" \
            --build-arg NEXT_PUBLIC_PUSHER_KEY="$NEXT_PUBLIC_PUSHER_KEY" \
            --build-arg NEXT_PUBLIC_PUSHER_CLUSTER="$NEXT_PUBLIC_PUSHER_CLUSTER" \
            --build-arg NEXT_PUBLIC_PUSHER_URL="$NEXT_PUBLIC_PUSHER_URL" .
          docker save "opex-preview:$ATTEMPT" | gzip > image.tar.gz
          CHECKSUM=$(sha256sum image.tar.gz | cut -d ' ' -f1)
          export CHECKSUM
          node -e 'require("fs").writeFileSync("manifest.json",JSON.stringify({attempt:process.env.ATTEMPT,sha:process.env.SHA,image:`opex-preview:${process.env.ATTEMPT}`,checksum:process.env.CHECKSUM}))'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: preview-${{ inputs.attempt }}
          path: |
            image.tar.gz
            manifest.json
          compression-level: 0
          retention-days: 3
